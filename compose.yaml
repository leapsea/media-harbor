services:
  media-harbor:
    image: ${IMAGE:-media-harbor:latest}
    build:
      context: .
      args:
        GALLERY_DL_VERSION: ${GALLERY_DL_VERSION:-}
        YTDLP_VERSION: ${YTDLP_VERSION:-}
        FFMPEG_VERSION: ${FFMPEG_VERSION:-}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${DOWNLOAD_PATH:-./downloads}:/downloads
      - ${ARCHIVE_PATH:-./archive}:/archive
      - ${LOG_PATH:-./logs}:/logs
    environment:
      LOG_DIR: /logs
      YTDLP_MAX_CONCURRENT: ${YTDLP_MAX_CONCURRENT:-3}
      GALLERY_DL_MAX_CONCURRENT: ${GALLERY_DL_MAX_CONCURRENT:-6}
      INSTAGRAM_USER_AGENT: ${INSTAGRAM_USER_AGENT:-}
      INSTAGRAM_REQUEST_INTERVAL_SECONDS: ${INSTAGRAM_REQUEST_INTERVAL_SECONDS:-6}
      INSTAGRAM_429_COOLDOWN_SECONDS: ${INSTAGRAM_429_COOLDOWN_SECONDS:-62}
      TZ: ${TZ:-Asia/Singapore}
