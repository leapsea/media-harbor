name: Build and publish Media Harbor

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
    inputs:
      check_updates:
        description: Check upstream dependencies and publish a new patch when updated
        type: boolean
        default: false
      gallery_dl:
        description: gallery-dl version
        type: string
        default: ''
      yt_dlp:
        description: yt-dlp version
        type: string
        default: ''
      ffmpeg:
        description: Alpine FFmpeg package version
        type: string
        default: ''

permissions:
  contents: read

# 发布串行执行，避免同一版本线同时分配补丁号。
concurrency:
  group: media-harbor-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    # 自动清单提交使用 GITHUB_TOKEN，不会额外触发 main/tag 的 push 工作流。
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      build: ${{ steps.release.outputs.build }}
      automatic: ${{ steps.release.outputs.automatic }}
      version: ${{ steps.release.outputs.version }}
      gallery_dl: ${{ steps.release.outputs.gallery_dl }}
      yt_dlp: ${{ steps.release.outputs.yt_dlp }}
      ffmpeg: ${{ steps.release.outputs.ffmpeg }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'schedule' || inputs.check_updates) && github.event.repository.default_branch || github.ref }}
      - name: Verify version rules
        run: python3 -m unittest discover -s scripts/tests
      - name: Resolve release candidate
        id: release
        env:
          CHECK: ${{ github.event_name == 'schedule' || inputs.check_updates }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          GALLERY_DL: ${{ inputs.gallery_dl }}
          YT_DLP: ${{ inputs.yt_dlp }}
          FFMPEG: ${{ inputs.ffmpeg }}
        run: |
          args=(resolve --output "$GITHUB_OUTPUT" --tag "$TAG")
          if [ "$CHECK" = true ]; then args+=(--check); fi
          python3 scripts/release.py "${args[@]}"
      - name: Commit and tag dependency update
        if: steps.release.outputs.automatic == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GALLERY_DL: ${{ steps.release.outputs.gallery_dl }}
          YT_DLP: ${{ steps.release.outputs.yt_dlp }}
          FFMPEG: ${{ steps.release.outputs.ffmpeg }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/release.py save --branch "$BRANCH"
      - name: Resolve build source
        id: source
        run: |
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  backend:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Backend tests and analysis
        run: |
          go test -race ./...
          go vet ./...

  frontend:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend tests and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  image:
    needs: [resolve, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP_VERSION: ${{ needs.resolve.outputs.version }}
      GALLERY: ${{ needs.resolve.outputs.gallery_dl }}
      YTDLP: ${{ needs.resolve.outputs.yt_dlp }}
      FFMPEG: ${{ needs.resolve.outputs.ffmpeg }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.source_sha }}
      # containerd 保存完整多架构索引，测试与发布使用同一份本地产物。
      - uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image identity
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
          tags: |
            type=ref,event=tag,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=v${{ env.APP_VERSION }},enable=${{ needs.resolve.outputs.automatic == 'true' }}
            type=raw,value=sha-${{ env.SOURCE_SHA }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.automatic == 'true' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')))) }}
      # 双架构一次构建，共用前端与 Go 依赖层；验证完成前不推送镜像。
      - name: Build multi-architecture test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          load: true
          tags: |
            media-harbor-smoke:tested
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 首次切换仍可读取旧缓存，后续统一保存两个架构的构建图。
          cache-from: |
            type=gha,scope=multiarch
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: type=gha,scope=multiarch,mode=max
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GALLERY_DL_VERSION=${{ env.GALLERY }}
            YTDLP_VERSION=${{ env.YTDLP }}
            FFMPEG_VERSION=${{ env.FFMPEG }}
      - name: Verify amd64 container
        env:
          SMOKE_IMAGE: media-harbor-smoke:tested
          SMOKE_PLATFORM: linux/amd64
          GALLERY_DL_VERSION: ${{ env.GALLERY }}
          YTDLP_VERSION: ${{ env.YTDLP }}
          FFMPEG_VERSION: ${{ env.FFMPEG }}
        run: python3 scripts/container-smoke.py
      - name: Verify arm64 container
        env:
          SMOKE_IMAGE: media-harbor-smoke:tested
          SMOKE_PLATFORM: linux/arm64
          # Ubuntu amd64 上由 QEMU 执行 Python 引擎与 FFmpeg，单阶段预算独立设置。
          SMOKE_TIMEOUT: '180'
          GALLERY_DL_VERSION: ${{ env.GALLERY }}
          YTDLP_VERSION: ${{ env.YTDLP }}
          FFMPEG_VERSION: ${{ env.FFMPEG }}
        run: python3 scripts/container-smoke.py
      - name: Log in to GHCR
        if: needs.resolve.outputs.automatic == 'true' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested multi-architecture image
        if: needs.resolve.outputs.automatic == 'true' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        # 不传 --platform，推送完整索引及两个架构，不重新构建。
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$PUBLISH_TAGS"
